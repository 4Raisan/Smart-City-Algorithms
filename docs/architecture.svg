<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Smart City Algorithms module architecture</title><desc id="desc">Main.java passes a shared Scanner to three independent menus: RoutePlanner, SortManager and PerformanceAnalyzer. All data is held in memory; no server or database is involved.</desc>
